apiVersion: apps/v1
kind: Deployment
metadata:
  name: los-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: los-frontend
  template:
    metadata:
      labels:
        app: los-frontend
    spec:
      containers:
        - name: frontend
          image: image-registry.example.com/los-demo/los-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi

